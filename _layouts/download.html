---
layout: page-sidebar
---
<nav class="woocommerce-breadcrumb"><a href="{{ '/' | relative_url }}">Home</a>&nbsp;/&nbsp;Download&nbsp;/&nbsp;{{ page.title }}</nav>
<div class="download-single">
  <h1 class="page-title">{{ page.title }}</h1>
  {% if page.thumbnail %}<p><img src="{{ page.thumbnail | relative_url }}" alt="{{ page.title }}" loading="lazy"></p>{% endif %}
  {% if page.file %}<p><a class="btn customify-btn" href="{{ page.file | relative_url }}" download>Download {{ page.file | split: "/" | last }}</a></p>{% endif %}
  <div class="entry-content">{{ content }}</div>
  <p class="note">Butuh penawaran atau file lain? <a href="{{ '/hubungi-kami/' | relative_url }}">Hubungi kami</a></p>
</div>
