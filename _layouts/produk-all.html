---
layout: default
body_class: archive post-type-archive-product woocommerce woocommerce-page
---
<div id="content" class="site-content"><div class="customify-container"><div class="customify-grid">
  <main id="site-content" class="content-area customify-col-9_sm-12">
    <div class="content-inner">
      <nav class="woocommerce-breadcrumb"><a href="{{ '/' | relative_url }}">Home</a>&nbsp;/&nbsp;Produk</nav>
      <div class="woocommerce-listing wc-product-listing wc-grid-view">
        <div class="wc-catalog-header"><h1 class="woocommerce-products-header__title page-title">{{ page.title }}</h1></div>
        <ul class="products columns-4">
          {% for p in site.products %}
            {% include product-grid-item.html p=p %}
          {% endfor %}
        </ul>
      </div>
    </div>
  </main>
  {% include sidebar.html %}
</div></div></div>
