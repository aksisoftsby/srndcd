<ul class="menu">
{% for item in site.data.navigation %}
  <li><a href="{{ item.url | relative_url }}" {% if item.external %}target="_blank" rel="noopener"{% endif %}>{{ item.title }}</a>
  {% if item.children %}
    <ul>{% for c in item.children %}<li><a href="{{ c.url | relative_url }}" {% if c.external %}target="_blank" rel="noopener"{% endif %}>{{ c.title }}</a></li>{% endfor %}</ul>
  {% endif %}
  </li>
{% endfor %}
</ul>
