<div class="card">
  <a href="{{ p.url | relative_url }}">
  {% if p.image %}<img src="{{ p.image | relative_url }}" alt="{{ p.title }}" loading="lazy">
  {% else %}<span class="card-img">{{ p.title }}</span>{% endif %}
  </a>
  <h3><a href="{{ p.url | relative_url }}">{{ p.title }}</a></h3>
  <a class="btn" href="{{ p.url | relative_url }}">Lihat Detail</a>
</div>
